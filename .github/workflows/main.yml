name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Technical Services Windows Setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS Installer
        run: npm run build:windows:nsis
        env:
          RUST_BACKTRACE: "1"

      - name: Find installer
        shell: pwsh
        run: |
          $source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "NSIS installer was not found."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null

          Copy-Item `
            $source.FullName `
            "dist-installer/Technical-Services-Setup.exe" `
            -Force

          Write-Host "========================================="
          Write-Host "INSTALLER CREATED SUCCESSFULLY"
          Write-Host "dist-installer/Technical-Services-Setup.exe"
          Write-Host "========================================="

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Technical-Services-Setup
          path: dist-installer/Technical-Services-Setup.exe
          if-no-files-found: error
          retention-days: 30
