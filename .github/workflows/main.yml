name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Technical Services Windows Setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run build:windows:nsis
        env:
          RUST_BACKTRACE: "1"

      - name: Prepare installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null

          $installer = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Installer EXE was not found."
            exit 1
          }

          Copy-Item `
            $installer.FullName `
            "dist-installer/Technical-Services-Setup.exe" `
            -Force

          Write-Host "Installer created:"
          Write-Host "dist-installer/Technical-Services-Setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Technical-Services-Setup
          path: dist-installer/Technical-Services-Setup.exe
          if-no-files-found: error
          retention-days: 30
