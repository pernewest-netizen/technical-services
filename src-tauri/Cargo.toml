[package]
name = "technical-services"
version = "1.0.0"
description = "Technical Services - Design & Production Management System"
authors = ["Technical Services Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all", "path-all", "os-all", "process-relaunch"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono", "serde_json", "uuid"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# Security
bcrypt = "0.15"
jsonwebtoken = "9.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
